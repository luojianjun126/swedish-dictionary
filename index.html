<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SvenskaMästare Pro - Swedish AI Dictionary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; overflow-x: hidden; }
        .swedish-gradient { background: linear-gradient(135deg, #005293 0%, #003d6e 100%); }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .inflection-card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; border: 1px solid #f1f5f9; }
        .inflection-card:hover { transform: translateY(-2px); border-color: #005293; background-color: #f0f9ff; box-shadow: 0 4px 12px rgba(0, 82, 147, 0.08); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen pb-20 selection:bg-blue-100">

    <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-xl border-b border-gray-100 px-6 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-4">
            <div class="w-12 h-8 bg-[#005293] relative rounded-md shadow-md overflow-hidden">
                <div class="absolute w-full h-2 bg-[#fecb00] top-[13px]"></div>
                <div class="absolute w-2 h-full bg-[#fecb00] left-[13px]"></div>
            </div>
            <div>
                <h1 class="text-xl font-black text-gray-900 leading-none tracking-tight">SvenskaMästare <span class="text-blue-600">Pro</span></h1>
                <div class="flex items-center gap-2 mt-1">
                    <span class="inline-block w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                    <span class="text-[10px] text-gray-500 font-bold tracking-widest uppercase">AI-Powered Suite</span>
                </div>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button id="openKeyModal" class="px-4 py-2.5 rounded-2xl bg-gray-100 text-gray-700 hover:bg-gray-200 transition-all font-bold text-xs flex items-center gap-1.5">
                <span>⚙️ API Key</span>
            </button>
            <button id="toggleVocab" class="group flex items-center gap-3 px-5 py-2.5 rounded-2xl bg-gray-900 text-white hover:bg-black transition-all shadow-lg active:scale-95">
                <span id="vocabCount" class="bg-[#fecb00] text-[#005293] text-[11px] font-black px-2 py-0.5 rounded-full min-w-[20px] text-center">0</span>
                <span class="text-sm font-semibold">语言资产库</span>
            </button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto mt-12 px-4">
        <div class="relative mb-12 group">
            <div class="absolute -inset-1 bg-gradient-to-r from-blue-600 to-cyan-500 rounded-3xl blur opacity-10 group-focus-within:opacity-25 transition duration-1000"></div>
            <div class="relative">
                <input type="text" id="searchInput" placeholder="输入任意瑞典语单词或短语..." 
                       class="w-full h-20 pl-8 pr-48 text-xl rounded-3xl border border-gray-200 focus:border-blue-500 bg-white shadow-2xl outline-none transition-all py-5 font-medium placeholder:text-gray-400">
                <div class="absolute right-3 top-3 bottom-3 flex gap-2">
                    <button id="searchBtn" class="px-8 swedish-gradient text-white rounded-2xl font-bold hover:shadow-lg hover:shadow-blue-900/20 transition-all flex items-center gap-2 active:scale-95">
                        <span id="searchLabel">✨ AI 分析</span>
                        <div id="searchLoader" class="hidden w-5 h-5 border-3 border-white/30 border-t-white rounded-full animate-spin"></div>
                    </button>
                </div>
            </div>
        </div>

        <div id="emptyState" class="text-center py-24 bg-white/50 rounded-[40px] border-2 border-dashed border-gray-200">
            <div class="inline-flex items-center justify-center w-24 h-24 bg-blue-50 rounded-full mb-8">
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#005293" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M8 7h6"/><path d="M8 11h8"/></svg>
            </div>
            <h2 class="text-3xl font-black text-gray-900 mb-3 tracking-tight">瑞典语 AI 词典</h2>
            <p class="text-gray-500 max-w-md mx-auto text-lg leading-relaxed">实时生成英文释义、全形态变化与中文语法分析。</p>
        </div>

        <div id="resultArea" class="hidden space-y-8 pb-20 animate-in fade-in slide-in-from-bottom-4 duration-500">
            <div class="glass-card rounded-[40px] p-10 shadow-2xl relative overflow-hidden">
                <div class="relative flex flex-col md:flex-row justify-between items-start md:items-center gap-8 mb-12">
                    <div class="space-y-4">
                        <div class="flex items-center gap-5 flex-wrap">
                            <h2 id="wordTitle" class="text-6xl font-[900] text-gray-900 tracking-tighter">Ord</h2>
                            <div class="flex items-center gap-2">
                                <button id="mainSpeakBtn" class="p-3 bg-blue-600 text-white rounded-2xl hover:bg-blue-700 transition-all shadow-lg active:scale-90">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
                                </button>
                                <span id="wordType" class="px-4 py-1.5 bg-blue-50 text-[#005293] text-[11px] font-black rounded-xl border border-blue-100 uppercase tracking-widest shadow-sm">POS</span>
                            </div>
                        </div>
                        <p id="wordTranslation" class="text-3xl text-blue-800 font-bold leading-tight"></p>
                    </div>
                    <button id="addVocabBtn" class="p-6 rounded-3xl bg-gray-50 hover:bg-red-50 text-gray-300 hover:text-red-500 transition-all border border-gray-100 group shadow-sm active:scale-90">
                        <svg id="heartIcon" xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="group-hover:scale-110 transition-transform"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                    </button>
                </div>

                <div id="inflectionSection" class="mb-14">
                    <h3 class="flex items-center gap-3 text-[11px] uppercase tracking-[0.2em] text-gray-400 font-black mb-6">
                        <span class="w-8 h-[2px] bg-gray-200"></span>
                        形态变化 (Böjningar)
                    </h3>
                    <div id="inflectionGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
                </div>

                <div class="mb-14 space-y-5">
                    <div class="bg-slate-900 rounded-[32px] p-8 text-white shadow-2xl relative overflow-hidden group">
                        <div class="flex items-center gap-3 mb-6">
                            <h3 class="text-[11px] uppercase tracking-[0.2em] text-blue-400 font-black">专家语法笔记 (Syntax Notes)</h3>
                        </div>
                        <p id="grammarNote" class="text-slate-200 leading-relaxed text-lg font-medium pr-20"></p>
                    </div>
                </div>

                <div class="space-y-8">
                    <h4 class="flex items-center gap-3 text-[11px] uppercase tracking-[0.2em] text-gray-400 font-black">
                        <span class="w-8 h-[2px] bg-gray-200"></span>
                        瑞典语双语例句 (Expert Context)
                    </h4>
                    <div id="exampleList" class="grid grid-cols-1 gap-6"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Key Modal -->
    <div id="keyModal" class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm hidden z-[70] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl">
            <h3 class="text-2xl font-black mb-2">设置 Gemini API Key</h3>
            <p class="text-gray-500 text-sm mb-6">输入你的 Gemini API Key 以启用真正的 AI 智能分析功能。</p>
            <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="w-full px-4 py-3 rounded-xl border border-gray-200 mb-6 focus:border-blue-500 outline-none">
            <div class="flex gap-3">
                <button id="saveKeyBtn" class="flex-1 py-3 swedish-gradient text-white rounded-xl font-bold">保存设置</button>
                <button id="closeKeyBtn" class="px-5 py-3 bg-gray-100 rounded-xl font-bold text-gray-600">取消</button>
            </div>
        </div>
    </div>

    <div id="vocabSidebar" class="fixed inset-y-0 right-0 w-full md:w-[500px] bg-white shadow-[-20px_0_50px_rgba(0,0,0,0.1)] transform translate-x-full transition-transform duration-500 z-[60] flex flex-col">
        <div class="p-8 border-b border-gray-100 flex justify-between items-center bg-gray-50/50 backdrop-blur-md">
            <h2 class="text-3xl font-black text-gray-900 tracking-tight">语言资产库</h2>
            <button id="closeVocab" class="p-4 hover:bg-gray-200 rounded-2xl transition-all active:scale-90">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
        </div>
        <div id="vocabList" class="flex-1 overflow-y-auto p-8 space-y-8 custom-scrollbar">
            <section id="vocabWords" class="space-y-4"></section>
        </div>
    </div>

    <div id="overlay" class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm hidden z-[55] transition-all duration-500 opacity-0"></div>

    <script>
        let storage = JSON.parse(localStorage.getItem('swedish_vocab') || '{"words":[]}');
        let apiKey = localStorage.getItem('gemini_api_key') || '';
        let currentWordData = null;

        function saveToLocal() { localStorage.setItem('swedish_vocab', JSON.stringify(storage)); }

        document.getElementById('openKeyModal').onclick = () => {
            document.getElementById('apiKeyInput').value = apiKey;
            document.getElementById('keyModal').classList.remove('hidden');
        };
        document.getElementById('closeKeyBtn').onclick = () => document.getElementById('keyModal').classList.add('hidden');
        document.getElementById('saveKeyBtn').onclick = () => {
            apiKey = document.getElementById('apiKeyInput').value.trim();
            localStorage.setItem('gemini_api_key', apiKey);
            document.getElementById('keyModal').classList.add('hidden');
            alert('API Key 保存成功！');
        };

        window.performSearch = async function(word) {
            const query = (word || document.getElementById('searchInput').value).trim();
            if (!query) return;

            if (!apiKey) {
                alert('请先点击右上角 “⚙️ API Key” 按钮配置你的 Gemini API Key！');
                document.getElementById('openKeyModal').click();
                return;
            }

            document.getElementById('searchLoader').classList.remove('hidden');
            document.getElementById('searchLabel').classList.add('opacity-0');

            const promptText = `Analyze the Swedish word or phrase: "${query}".
Return ONLY a raw JSON string without markdown formatting, matching this exact structure:
{
  "word": "${query}",
  "type": "Part of speech (e.g. Substantiv (en), Verb (-ar))",
  "translation": "English translation",
  "inflections": [
    {"label": "Form 1", "value": "word form"}
  ],
  "grammar": "Simplified Chinese grammar explanation",
  "examples": [
    {"sv": "Swedish example", "en": "English translation", "explanation": "Chinese explanation"}
  ]
}`;

            const models = ['gemini-1.5-flash', 'gemini-1.5-pro', 'gemini-2.0-flash-exp'];
            let lastErrorMsg = '';
            let success = false;

            for (const model of models) {
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: promptText }] }]
                        })
                    });

                    const rawData = await res.json();

                    if (!res.ok) {
                        lastErrorMsg = rawData.error?.message || res.statusText;
                        console.error(`Model ${model} failed:`, rawData);
                        continue;
                    }

                    let textResult = rawData.candidates[0].content.parts[0].text;
                    textResult = textResult.replace(/```json/g, '').replace(/```/g, '').trim();
                    
                    const data = JSON.parse(textResult);
                    currentWordData = data;
                    renderResult(data);
                    document.getElementById('emptyState').classList.add('hidden');
                    document.getElementById('resultArea').classList.remove('hidden');
                    updateWordHeartUI();
                    success = true;
                    break;
                } catch (err) {
                    lastErrorMsg = err.message;
                    console.error(`Error querying ${model}:`, err);
                }
            }

            if (!success) {
                alert(`请求失败，API 返回错误信息:\n${lastErrorMsg || '网络错误或跨域拦截'}\n\n请确认输入的 Key 正确（必须是 AIzaSy 开头）。`);
            }

            document.getElementById('searchLoader').classList.add('hidden');
            document.getElementById('searchLabel').classList.remove('opacity-0');
        };

        function renderResult(data) {
            document.getElementById('wordTitle').textContent = data.word;
            document.getElementById('wordType').textContent = data.type || '';
            document.getElementById('wordTranslation').textContent = data.translation || '';
            document.getElementById('grammarNote').textContent = data.grammar || '';
            
            const grid = document.getElementById('inflectionGrid');
            if (data.inflections && data.inflections.length > 0) {
                document.getElementById('inflectionSection').classList.remove('hidden');
                grid.innerHTML = data.inflections.map(inf => `
                    <div class="inflection-card bg-white p-5 rounded-2xl shadow-sm" onclick="speakText('${inf.value}')">
                        <p class="text-[9px] text-blue-500 uppercase font-black mb-1.5 opacity-70">${inf.label}</p>
                        <p class="text-gray-900 font-extrabold text-base">${inf.value}</p>
                    </div>
                `).join('');
            } else {
                document.getElementById('inflectionSection').classList.add('hidden');
            }

            const list = document.getElementById('exampleList');
            list.innerHTML = (data.examples || []).map(ex => `
                <div class="p-8 bg-white border border-slate-100 rounded-[32px] shadow-sm">
                    <p class="text-2xl font-black text-slate-900 mb-4 cursor-pointer hover:text-blue-600" onclick="speakText('${ex.sv}')">${ex.sv}</p>
                    <p class="text-slate-500 italic text-lg mb-5 pl-4 border-l-4 border-slate-100">${ex.en}</p>
                    <div class="pt-5 border-t border-dashed border-slate-100 text-[13px] text-slate-400">${ex.explanation}</div>
                </div>
            `).join('');
            
            document.getElementById('mainSpeakBtn').onclick = () => speakText(data.word);
            speakText(data.word);
        }

        window.speakText = (text) => {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'sv-SE';
            window.speechSynthesis.speak(u);
        };

        function updateWordHeartUI() {
            const isSaved = storage.words.some(w => w.word === currentWordData?.word);
            const heart = document.getElementById('heartIcon');
            heart.setAttribute('fill', isSaved ? '#f43f5e' : 'none');
            heart.setAttribute('stroke', isSaved ? '#f43f5e' : 'currentColor');
        }

        window.toggleSaveWord = function() {
            if (!currentWordData) return;
            const idx = storagewords.findIndex(w => w.word === currentWordData.word);
            if (idx > -1) {
                storage.words.splice(idx, 1);
            } else {
                storage.words.push({ word: currentWordData.word, translation: currentWordData.translation });
            }
            updateWordHeartUI();
            saveToLocal();
            renderVocab();
        };

        function renderVocab() {
            const list = document.getElementById('vocabWords');
            const words = storage.words || [];
            document.getElementById('vocabCount').textContent = words.length;
            if (words.length === 0) {
                list.innerHTML = `<div class="text-center py-20 text-gray-400 font-medium">暂无资产</div>`;
                return;
            }
            list.innerHTML = words.slice().reverse().map(w => `
                <div class="vocab-item p-6 bg-white rounded-3xl border border-slate-100 flex justify-between items-center cursor-pointer hover:border-blue-500" onclick="performSearch('${w.word}'); closeSidebar();">
                    <div>
                        <p class="font-black text-slate-900 text-lg">${w.word}</p>
                        <p class="text-xs text-slate-500 font-bold">${w.translation}</p>
                    </div>
                </div>
            `).join('');
        }

        function closeSidebar() { 
            document.getElementById('vocabSidebar').classList.add('translate-x-full'); 
            document.getElementById('overlay').classList.add('hidden'); 
        }

        document.getElementById('searchBtn').onclick = () => performSearch();
        document.getElementById('searchInput').onkeypress = (e) => { if(e.key === 'Enter') performSearch(); };
        document.getElementById('addVocabBtn').onclick = toggleSaveWord;
        document.getElementById('toggleVocab').onclick = () => {
            document.getElementById('vocabSidebar').classList.remove('translate-x-full');
            document.getElementById('overlay').classList.remove('hidden');
        };
        document.getElementById('closeVocab').onclick = closeSidebar;
        document.getElementById('overlay').onclick = closeSidebar;

        renderVocab();
        window.closeSidebar = closeSidebar;
    </script>
</body>
</html>
